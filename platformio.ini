; 答案之书 —— M5Stack Cardputer ADV
;
; 关键约束（见 README）：
;   * Launcher 首次给应用分配的 OTA 槽是 0x150000 (1.375MB)，固件必须小于它；
;   * ADV 没有 PSRAM，所以不要打开 PSRAM 选项；
;   * 产物 build/cardputer-adv/firmware.bin 就是 Launcher 要安装的 app 镜像，
;     不要用 esptool 把它烧到 0x0，也不要合并 bootloader。

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.12.0
; Cardputer ADV = ESP32-S3FN8（8MB Flash，无 PSRAM），用通用 S3 devkit 板型即可
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.offset_address = 0x10000

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Os

lib_deps =
    m5stack/M5Unified@^0.3.0

monitor_speed = 115200
