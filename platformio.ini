; Cardputer ADV 五件套：
;   answer-book  答案之书（分类 / 摇一摇 / 追问 / SD 主题包）
;   iching       易经六爻
;   decider      二选一决策器
;   pocketpet    口袋宠物（像素精灵 / 养成 / 战斗）
;   dice         骰子与硬币（摇一摇）
;
; 五个环境共用 src/core，各自只编译自己的 main.cpp。
; 产物都是标准 app 镜像，分别交给 Launcher 安装。

[platformio]
default_envs = answer-book, iching, decider, pocketpet, dice

[env]
platform = espressif32@6.12.0
; Cardputer ADV = ESP32-S3FN8（8MB Flash，无 PSRAM）
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.offset_address = 0x10000

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Os
    -Isrc/core

lib_deps =
    m5stack/M5Unified@^0.3.0

monitor_speed = 115200

[env:answer-book]
build_src_filter = -<*> +<core/> +<apps/answer_book/>

[env:iching]
build_src_filter = -<*> +<core/> +<apps/iching/>

[env:decider]
build_src_filter = -<*> +<core/> +<apps/decider/>

[env:pocketpet]
build_src_filter = -<*> +<core/> +<apps/pocketpet/>

[env:dice]
build_src_filter = -<*> +<core/> +<apps/dice/>
